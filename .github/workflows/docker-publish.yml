name: Publish Docker image

# Publishes a multi-arch image (amd64 + arm64) to Docker Hub. arm64 matters
# here: CasaOS most often runs on a Raspberry Pi or an ARM mini-PC, and an
# amd64-only image simply won't start there.
#
# Triggers on a version tag (v1.2.3) and on manual dispatch. Cut the tag from a
# green main — the `test` job below is a second guard, not a substitute for CI.
#
# Requires two repository secrets:
#   DOCKERHUB_USERNAME  — your Docker Hub account
#   DOCKERHUB_TOKEN     — a Docker Hub access token (not your password)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. v1.0.0 or latest)'
        required: true
        default: 'latest'

env:
  IMAGE: uasneppy/ukrainealertsbot

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # QEMU lets the amd64 runner build the arm64 image. It's slow (apt install
      # of Chromium runs under emulation) but correct, and a release is rare.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Derives tags from the git ref: a v1.2.3 tag yields 1.2.3, 1.2, and
      # latest; a manual run uses the tag you typed.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
